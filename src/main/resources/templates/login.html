<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вход</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<section class="login-section">
    <div class="login-card">
        <h2 class="text-center mb-4">Вход в систему</h2>

        <div th:if="${param.error}" class="alert alert-danger">
            Неверный логин или пароль
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            Вы вышли из системы
        </div>

        <form method="post" action="/login">
            <input class="form-control mb-3" name="username" placeholder="Логин" required>

            <input class="form-control mb-4" type="password" name="password" placeholder="Пароль" required>

            <button class="btn btn-dark w-100">Войти</button>
        </form>

        <div class="mt-3 text-center">
            <a href="/" class="btn btn-outline-dark w-100 back-btn">
                На главную
            </a>
        </div>
    </div>
</section>

</body>
</html>
