<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">Admin Panel</span>
    <a href="/" class="btn btn-outline-light btn-sm">На сайт</a>
</nav>

<div class="container py-5">

    <h2 class="mb-4">Заявки</h2>

    <div class="card shadow-sm p-3">
        <table class="table align-middle">

            <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Телефон</th>
                <th>Email</th>
                <th>Компания</th>
                <th>Должность</th>
                <th>Дата</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="lead : ${leads}">
                <td th:text="${lead.id}"></td>
                <td th:text="${lead.name}"></td>
                <td th:text="${lead.phone}"></td>
                <td th:text="${lead.email}"></td>
                <td th:text="${lead.company}"></td>
                <td th:text="${lead.position}"></td>
                <td th:text="${#temporals.format(lead.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-5">
        <a href="/admin/stats" class="btn btn-dark">Посмотреть статистику</a>
    </div>
</div>

</body>
</html>
